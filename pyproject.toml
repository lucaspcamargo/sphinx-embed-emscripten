[project]
name = "sphinx-embed-emscripten"
version = "0.1.0"
description = "Sphinx extension for embedding Emscripten games and demos in HTML documents"
readme = "README.md"
authors = [{ name = "Lucas Pires Camargo" }]
maintainers = [{ name = "Lucas Pires Camargo" }]
keywords = ["documentation", "sphinx", "extension", "emscripten", "webassembly", "games"]
classifiers = [
    "Environment :: Plugins",
    "Framework :: Sphinx",
    "Framework :: Sphinx :: Extension",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Topic :: Documentation",
    "Topic :: Documentation :: Sphinx",
    "Topic :: Games/Entertainment",
]

requires-python = ">=3.10"
dependencies = [
    "Sphinx >= 7",
]

[project.urls]
homepage = "https://camargo.eng.br"
repository = "https://github.com/lucaspcamargo/sphinx-embed-emscripten"

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"sphinx_embed_emscripten" = [
    "_static/**/*",
]
